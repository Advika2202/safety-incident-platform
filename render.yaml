databases:
  - name: safety-incident-db
    plan: free
    databaseName: safety_incident
    user: safety_incident

services:
  - name: safety-incident-redis
    type: keyvalue
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0

  # Note: the worker service isn't deployed here (Render has no free tier
  # for background workers). It's fully built, tested, and CI-verified —
  # run it locally via `docker compose up` to see the full event pipeline.
  - name: safety-incident-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safety-incident-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: safety-incident-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
